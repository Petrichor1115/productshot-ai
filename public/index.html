<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · ProductShot AI 商品套图生成器</title>
  <meta name="description" content="上传一张商品图，AI 一键生成电商标准化套图（主图 / 场景图 / 卖点图）" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/user.css" />
</head>
<body data-app="user" class="auth-page">
  <main class="auth-card" role="main">
    <div class="auth-card__logo" id="authLogo" aria-hidden="true"></div>
    <h1 class="auth-card__title" id="authTitle">ProductShot</h1>
    <p class="auth-card__subtitle" id="authSubtitle">AI 商品套图生成器</p>

    <form class="auth-card__form" id="authForm" novalidate>
      <div class="field">
        <label class="field__label" for="username">用户名</label>
        <input class="input" id="username" type="text" placeholder="请输入用户名" autocomplete="username" />
        <p class="field__error" id="usernameError" role="alert"></p>
      </div>

      <div class="field">
        <label class="field__label" for="password">密码</label>
        <input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
        <p class="field__error" id="passwordError" role="alert"></p>
      </div>

      <p class="field__error" id="formError" role="alert" style="min-height:0"></p>

      <button class="btn btn--primary btn--lg btn--block" id="submitBtn" type="button">登 录</button>
    </form>

    <div class="auth-card__footer">
      <span id="toggleText">没有账号？<a id="toggleLink" class="auth-card__link">立即注册</a></span>
      <a id="adminLink" class="auth-card__link" href="/admin.html">管理员入口 →</a>
    </div>
  </main>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
