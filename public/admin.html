<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理后台登录 · ProductShot Admin</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/user.css" />
</head>
<body data-app="admin" class="auth-page">
  <main class="auth-card" role="main">
    <div class="auth-card__logo" id="authLogo" aria-hidden="true"></div>
    <h1 class="auth-card__title" id="authTitle">管理后台</h1>
    <p class="auth-card__subtitle" id="authSubtitle">ProductShot Admin</p>

    <form class="auth-card__form" id="authForm" novalidate>
      <div class="field">
        <label class="field__label" for="username">管理员账号</label>
        <input class="input" id="username" type="text" placeholder="请输入管理员账号" autocomplete="username" />
        <p class="field__error" id="usernameError" role="alert"></p>
      </div>

      <div class="field">
        <label class="field__label" for="password">密码</label>
        <input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
        <p class="field__error" id="passwordError" role="alert"></p>
      </div>

      <p class="field__error" id="formError" role="alert" style="min-height:0"></p>

      <button class="btn btn--primary btn--lg btn--block" id="submitBtn" type="button">登 录</button>
    </form>

    <div class="auth-card__footer">
      <span id="toggleText"></span>
      <a id="adminLink" class="auth-card__link" href="/index.html">← 返回用户端登录</a>
    </div>
  </main>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
